name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
      - run: go test ./...
      - name: Set up minisign
        env:
          MINISIGN_SECRET_KEY: ${{ secrets.MINISIGN_SECRET_KEY }}
        run: |
          sudo apt-get update -qq && sudo apt-get install -y -qq minisign
          test -n "$MINISIGN_SECRET_KEY" || { echo "secret MINISIGN_SECRET_KEY is not set"; exit 1; }
          umask 077
          printf '%s\n' "$MINISIGN_SECRET_KEY" > "$RUNNER_TEMP/minisign.key"
          echo "MINISIGN_KEY_FILE=$RUNNER_TEMP/minisign.key" >> "$GITHUB_ENV"
          # fail before publishing if the secret does not match the public key in the repository
          echo probe > "$RUNNER_TEMP/probe"
          minisign -S -s "$RUNNER_TEMP/minisign.key" -m "$RUNNER_TEMP/probe" < /dev/null
          minisign -V -p keys/release_sign.pub -m "$RUNNER_TEMP/probe"
      - uses: goreleaser/goreleaser-action@v6
        with:
          version: "~> v2"
          args: release --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
