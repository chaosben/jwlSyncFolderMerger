version: 2

project_name: jwlSyncFolderMerger

before:
  hooks:
    - go mod tidy

builds:
  - id: jwlSyncFolderMerger
    main: ./cmd/jwlSyncFolderMerger
    binary: jwlSyncFolderMerger
    env:
      - CGO_ENABLED=0
    goos: [linux, windows, darwin]
    goarch: [amd64, arm64, arm]
    # 32-bit ARM for Raspberry Pi: v6 = Pi Zero/1, v7 = Pi 2/3/4 with 32-bit OS.
    # 64-bit Raspberry Pi OS (Pi 3/4/5) uses linux/arm64.
    goarm: ["6", "7"]
    ignore:
      - goos: windows
        goarch: arm
      - goos: darwin
        goarch: arm
    flags: [-trimpath]
    ldflags:
      - -s -w -X main.version={{ .Version }}

archives:
  - formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: "{{ .ProjectName }}_{{ .Version }}_{{ .Os }}_{{ .Arch }}{{ with .Arm }}v{{ . }}{{ end }}"
    files:
      - README.md
      - LICENSE*
      - integrations/**/*

checksum:
  name_template: checksums.txt

changelog:
  sort: asc
  filters:
    exclude: ["^docs:", "^test:", "^chore:"]
